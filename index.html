<!DOCTYPE html>
<html>
<head>
    <title>Nipah Risk Mapping - Interactive Layers</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        .info { 
            padding: 10px 12px; 
            background: white; 
            box-shadow: 0 0 15px rgba(0,0,0,0.2); 
            border-radius: 5px; 
            max-width: 300px;
        }
        
        .info h4 { margin: 0 0 5px; color: #333; }
        .info p { margin: 5px 0; font-size: 12px; color: #666; }
        
        .legend {
            line-height: 20px;
            color: #555;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            max-width: 250px;
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .legend h4 { margin: 0 0 8px; font-size: 14px; }
        
        .legend i {
            width: 20px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.8;
            border: 1px solid #ccc;
        }
        
        .legend .item { 
            margin-bottom: 5px; 
            overflow: hidden; 
            font-size: 11px;
        }
        
        .legend .item.toggleable {
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            transition: opacity 0.2s;
        }
        
        .legend .item.toggleable:hover {
            background: #f0f0f0;
        }
        
        .legend .item.toggleable.hidden-class {
            opacity: 0.35;
            text-decoration: line-through;
        }
        
        .legend .item.toggleable input[type="checkbox"] {
            margin-right: 4px;
            vertical-align: middle;
            cursor: pointer;
        }
        
        .legend .gradient-bar {
            width: 100%;
            height: 20px;
            margin: 10px 0;
            border: 1px solid #ccc;
        }
        
        .legend .gradient-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-top: 3px;
        }
        
        .legend .plague-cases-section {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }
        
        .legend .plague-case-symbol {
            display: inline-block;
            font-size: 18px;
            color: #1e88e5;
            text-shadow: 1px 1px 2px #FFF, -1px -1px 2px #FFF, 1px -1px 2px #FFF, -1px 1px 2px #FFF;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        .layer-control {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
            max-width: 220px;
        }
        
        .layer-control h4 { 
            margin: 0 0 10px; 
            font-size: 14px;
        }
        
        .layer-control label {
            display: block;
            margin: 8px 0;
            cursor: pointer;
            font-size: 13px;
        }
        
        .layer-control input[type="radio"] {
            margin-right: 8px;
        }
        
        .layer-control input[type="checkbox"] {
            margin-right: 8px;
        }
        
        .layer-control .overlay-section {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }
        
        .layer-control .overlay-section h5 {
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .opacity-section {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }
        
        .opacity-section h5 {
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .opacity-control {
            margin-bottom: 12px;
        }
        
        .opacity-control label {
            display: block;
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
        }
        
        .opacity-control input[type="range"] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        
        .opacity-value {
            float: right;
            font-weight: bold;
            color: #333;
            font-size: 11px;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            z-index: 1000;
            text-align: center;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            margin: 5px 0;
            border-radius: 3px;
            font-size: 12px;
        }
        
        .leaflet-popup-content {
            margin: 10px;
            font-size: 12px;
        }
        
        .leaflet-popup-content h3 {
            margin: 0 0 8px;
            font-size: 14px;
            color: #333;
        }
        
        .leaflet-popup-content table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .leaflet-popup-content table td {
            padding: 3px 5px;
            border-bottom: 1px solid #eee;
        }
        
        .leaflet-popup-content table td:first-child {
            font-weight: bold;
            color: #666;
            width: 50%;
        }
        
        .copy-notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .copy-notification.show {
            opacity: 1;
        }
        
        .layer-description {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 14px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            z-index: 800;
            max-width: 420px;
            font-size: 11px;
            line-height: 1.4;
            color: #333;
            resize: both;
            overflow: auto;
            min-width: 200px;
            min-height: 30px;
            max-height: 200px;
            cursor: default;
        }
        
        .layer-description h4 {
            margin: 0 0 4px;
            font-size: 12px;
            color: #222;
        }
        
        .layer-description p {
            margin: 0;
        }
        
        .layer-description.hidden {
            display: none;
        }
        </style>
</head>
<body>
    <div id="map"></div>
    <div id="layer-description" class="layer-description hidden"></div>
    <div id="copy-notification" class="copy-notification"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet@3.10.0/dist/georaster-layer-for-leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

    <script>
        // =====================================================================
        // MAP INITIALIZATION - centered on Bangladesh/India Nipah endemic region
        // =====================================================================
        var map = L.map('map').setView([17.329664, 82.880859], 6);

        // Create custom panes with specific z-index ordering
        map.createPane('backgroundPane');
        map.getPane('backgroundPane').style.zIndex = 250;
        
        map.createPane('rasterPane');
        map.getPane('rasterPane').style.zIndex = 300;
        
        // Individual panes for each raster layer
        var rasterPaneIds = ['enm', 'enm_cv', 'basic_risk', 'blend_risk', 'risk_blend_cv', 'diff_blend_minus_basic'];
        rasterPaneIds.forEach(function(id, i) {
            map.createPane('raster_' + id);
            map.getPane('raster_' + id).style.zIndex = 310 + i;
        });
        
        map.createPane('speciesRasterPane');
        map.getPane('speciesRasterPane').style.zIndex = 320;
        
        map.createPane('speciesVectorPane');
        map.getPane('speciesVectorPane').style.zIndex = 360;
        
        map.createPane('boundariesPane');
        map.getPane('boundariesPane').style.zIndex = 350;

        // Define basemaps
        var streetMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 19
        });

        var satelliteMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 19
        });

        var topoMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 19
        });

        // Add default basemap
        satelliteMap.addTo(map);

        // =====================================================================
        // STATE VARIABLES
        // =====================================================================
        var layers = {};
        var georasters = {};
        var currentLayer = null;
        var activeLayers = {};
        var loadedCount = 0;
        var totalLayers = 6; // enm, enm_cv, basic_risk, blend_risk, risk_blend_cv, diff_blend_minus_basic
        var nipahCasesLayer = null;
        var adminBoundariesLayer = null;

        var DEFAULT_OPACITY = 1.0;
        
        var hiddenClasses = {
            'enm': {},
            'enm_cv': {},
            'basic_risk': {},
            'blend_risk': {},
            'risk_blend_cv': {},
            'diff_blend_minus_basic': {}
        };


        // =====================================================================
        // VECTOR OVERLAY CONFIGS — Outbreaks & Survey Data
        // =====================================================================
        var speciesSurveyLayers = {};
        var speciesSurveyConfigs = {
            'gbif_bats': {
                file: 'gbif_bats.geojson',
                name: 'GBIF Bat Species Occurrences',
                color: '#8B5CF6',
                fillColor: '#8B5CF6',
                radius: 5,
                weight: 1.5,
                icon: 'circle',
                colorBySpecies: true
            },
            'nipah_survey': {
                file: 'survey.geojson',
                name: 'Bat Survey & Phylogeographic Data',
                color: '#10B981',
                fillColor: '#10B981',
                radius: 7,
                weight: 2,
                icon: 'diamond',
                colorBySpecies: false
            }
        };

        // Species color palette for GBIF bat data
        var gbifSpeciesColors = {
            'Pteropus medius':           '#e31a1c',
            'Pteropus giganteus':        '#ff7f00',
            'Rousettus leschenaultii':   '#6a3d9a',
            'Hipposideros larvatus':     '#1f78b4',
            'Pteropus vampyrus':        '#33a02c',
            'Rousettus amplexicaudatus': '#fb9a99'
        };
        var gbifSpeciesList = [];
        var gbifSpeciesCounts = {};
        var hiddenGbifSpecies = {};

        function getGbifSpeciesColor(species) {
            if (!species || species === '') return '#999999';
            return gbifSpeciesColors[species] || '#999999';
        }

        // =====================================================================
        // LAYER CONFIGURATIONS — all 6 raster layers loaded via georaster
        // =====================================================================
        var layerConfigs = {
            'enm': {
                file: 'enm_cog.tif',
                name: 'Ecological Niche Model (1km)',
                colors: ['#969696', '#fed976', '#feb24c', '#fd8d3c', '#fc4e2a', '#e31a1c', '#b10026'],
                domain: [0, 912],
                labels: ['Low Suitability', 'High Suitability'],
                description: 'Nipah ENM habitat suitability',
                mode: 'lch',
                continuousLegend: true
            },
            'enm_cv': {
                file: 'enm_cv.tif',
                name: 'ENM Coefficient of Variation (1km)',
                colors: ['#edf8e9', '#74c476', '#31a354', '#006d2c', '#00441b'],
                domain: [0, 297],
                labels: ['Low Uncertainty', 'High Uncertainty'],
                description: '',
                mode: 'lch',
                continuousLegend: true
            },
            'basic_risk': {
                file: 'risk_basic.tif',
                name: 'Baseline Risk (ENM + Pop)',
                discreteColors: {
                    0: '#000000',
                    1: '#FFFFBE',
                    2: '#FFDD00',
                    3: '#FFAA00',
                    4: '#FF6600',
                    6: '#FF0000',
                    9: '#A80000'
                },
                noDataValue: 15,
                labels: ['No Risk', 'Very High Risk'],
                description: '',
                infoDescription: 'Product of ENM suitability (0–3) and population count (0–3) classes. Values range 0–9, where 0 = ecologically unsuitable or uninhabited and 9 = highest suitability co-occurring with highest population. Provides a baseline exposure risk before any land cover adjustment.',
                customLegend: true,
                discreteDisplay: true,
                legendItems: [
                    { value: 0, color: '#000000', label: '0 – No Risk' },
                    { value: 1, color: '#FFFFBE', label: '1 – Very Low Risk' },
                    { value: 2, color: '#FFDD00', label: '2 – Low Risk' },
                    { value: 3, color: '#FFAA00', label: '3 – Moderate Risk' },
                    { value: 4, color: '#FF6600', label: '4 – Elevated Risk' },
                    { value: 6, color: '#FF0000', label: '6 – High Risk' },
                    { value: 9, color: '#A80000', label: '9 – Very High Risk' }
                ]
            },
            'blend_risk': {
                file: 'risk_blend.tif',
                name: 'Landcover Weighted Risk (ENM + Pop + LC)',
                discreteColors: {
                    0: '#000000',
                    1: '#FFFFBE',
                    2: '#FFDD00',
                    3: '#FFAA00',
                    4: '#FF6600',
                    6: '#FF0000',
                    9: '#A80000'
                },
                noDataValue: 15,
                labels: ['No Risk', 'Very High Risk'],
                description: '',
                infoDescription: 'Ensemble mean of 9 scenarios (3 α × 3 blend steepness) where baseline risk is modified by region-specific land cover weights. Outbreak-associated land cover types (Built, Crops, Flooded vegetation) boost risk; underrepresented types (Water, Grass, Bare ground) dampen it. Integrates ecology, population, and landscape context into a single composite index.',
                customLegend: true,
                discreteDisplay: true,
                legendItems: [
                    { value: 0, color: '#000000', label: '0 – No Risk' },
                    { value: 1, color: '#FFFFBE', label: '1 – Very Low Risk' },
                    { value: 2, color: '#FFDD00', label: '2 – Low Risk' },
                    { value: 3, color: '#FFAA00', label: '3 – Moderate Risk' },
                    { value: 4, color: '#FF6600', label: '4 – Elevated Risk' },
                    { value: 6, color: '#FF0000', label: '6 – High Risk' },
                    { value: 9, color: '#A80000', label: '9 – Very High Risk' }
                ]
            },
            'risk_blend_cv': {
                file: 'risk_blend_cv.tif',
                name: 'Ensemble CV',
                discreteColors: {
                    0: '#000000',
                    2: '#deebf7',
                    3: '#9ecae1',
                    4: '#4292c6',
                    5: '#2171b5',
                    6: '#08976e',
                    7: '#238b45',
                    8: '#00441b'
                },
                noDataValue: 255,
                labels: ['Low CV', 'High CV'],
                description: '',
                infoDescription: 'Coefficient of variation (SD/mean × 100) across 9 ensemble members. Low values indicate stable risk estimates regardless of parameter choice. Higher values identify cells sensitive to α and blend steepness parameters, providing a spatially explicit measure of methodological uncertainty.',
                customLegend: true,
                discreteDisplay: true,
                legendItems: [
                    { value: 0, color: '#000000', label: '0 – No Variability' },
                    { value: 2, color: '#deebf7', label: '2 – Low CV' },
                    { value: 3, color: '#9ecae1', label: '3 – Low-Moderate CV' },
                    { value: 4, color: '#4292c6', label: '4 – Moderate CV' },
                    { value: 5, color: '#2171b5', label: '5 – Moderate-High CV' },
                    { value: 6, color: '#08976e', label: '6 – High CV' },
                    { value: 7, color: '#238b45', label: '7 – Very High CV' },
                    { value: 8, color: '#00441b', label: '8 – Extreme CV' }
                ]
            },
            'diff_blend_minus_basic': {
                file: 'diff_blend_minus_basic.tif',
                name: 'Normalized Difference Surface',
                discreteColors: {
                    1: '#2166ac',
                    2: '#67a9cf',
                    3: '#92c5de',
                    4: '#333333',
                    5: '#f4a582',
                    6: '#ef8a62',
                    7: '#b2182b'
                },
                noDataValue: 15,
                labels: ['Decrease', 'Increase'],
                description: '',
                infoDescription: 'Difference between normalized (0–1) land-cover-weighted ensemble mean and normalized baseline. Positive values = land cover increased risk (Built, Crops, Flooded vegetation). Negative values = land cover reduced risk (forested areas). Near zero = minimal land cover effect. Isolates the specific contribution of landscape context beyond ecology and population.',
                customLegend: true,
                discreteDisplay: true,
                legendItems: [
                    { value: 1, color: '#2166ac', label: '1 – Large Decrease' },
                    { value: 2, color: '#67a9cf', label: '2 – Moderate Decrease' },
                    { value: 3, color: '#92c5de', label: '3 – Small Decrease' },
                    { value: 4, color: '#333333', label: '4 – No Change' },
                    { value: 5, color: '#f4a582', label: '5 – Small Increase' },
                    { value: 6, color: '#ef8a62', label: '6 – Moderate Increase' },
                    { value: 7, color: '#b2182b', label: '7 – Large Increase' }
                ]
            }
        };

        // =====================================================================
        // MEASUREMENT TOOLS
        // =====================================================================
        var drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        var drawControl = new L.Control.Draw({
            position: 'topright',
            draw: {
                polyline: {
                    shapeOptions: { color: '#f357a1', weight: 3 },
                    metric: true,
                    feet: false,
                    showLength: true
                },
                polygon: {
                    shapeOptions: { color: '#f357a1', weight: 3 },
                    showArea: true,
                    metric: true
                },
                rectangle: {
                    shapeOptions: { color: '#4CAF50', weight: 3, fillOpacity: 0.1 }
                },
                circle: false,
                marker: false,
                circlemarker: false
            },
            edit: {
                featureGroup: drawnItems,
                remove: true
            }
        });
        map.addControl(drawControl);

        map.on(L.Draw.Event.CREATED, function (event) {
            var layer = event.layer;
            var type = event.layerType;
            
            if (type === 'polyline') {
                var length = 0;
                var latlngs = layer.getLatLngs();
                for (var i = 0; i < latlngs.length - 1; i++) {
                    length += latlngs[i].distanceTo(latlngs[i + 1]);
                }
                var lengthKm = (length / 1000).toFixed(2);
                layer.bindPopup('<b>Distance:</b> ' + lengthKm + ' km');
                drawnItems.addLayer(layer);
            } else if (type === 'polygon') {
                var area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
                var areaKm = (area / 1000000).toFixed(2);
                layer.bindPopup('<b>Area:</b> ' + areaKm + ' km²');
                drawnItems.addLayer(layer);
            } else if (type === 'rectangle') {
                var bounds = layer.getBounds();
                var area = (bounds.getNorth() - bounds.getSouth()) * 
                           (bounds.getEast() - bounds.getWest()) * 111 * 111;
                layer.bindPopup('<b>Rectangle Area:</b> ~' + area.toFixed(2) + ' km²');
                drawnItems.addLayer(layer);
            }
        });

        // =====================================================================
        // COORDINATE COPY
        // =====================================================================
        function copyCoordinatesToClipboard(lat, lng) {
            var coordText = lat.toFixed(6) + ', ' + lng.toFixed(6);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(coordText).then(function() {
                    showCopyNotification('Coordinates copied: ' + coordText);
                }).catch(function(err) {
                    fallbackCopyTextToClipboard(coordText);
                });
            } else {
                fallbackCopyTextToClipboard(coordText);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            var textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                var successful = document.execCommand('copy');
                if (successful) {
                    showCopyNotification('Coordinates copied: ' + text);
                } else {
                    showCopyNotification('Failed to copy coordinates', true);
                }
            } catch (err) {
                showCopyNotification('Failed to copy coordinates', true);
            }
            document.body.removeChild(textArea);
        }

        function showCopyNotification(message, isError) {
            var notification = document.getElementById('copy-notification');
            notification.textContent = message;
            notification.style.background = isError ? 'rgba(198, 40, 40, 0.9)' : 'rgba(0, 0, 0, 0.8)';
            notification.classList.add('show');
            setTimeout(function() {
                notification.classList.remove('show');
            }, 2000);
        }

        // =====================================================================
        // UTILITY FUNCTIONS
        // =====================================================================
        function updateStatus(message, isError) {
            console.log(message);
        }

        function updateLayerOpacity(layerId, opacity) {
            if (layers[layerId]) {
                layers[layerId].setOpacity(opacity);
            }
        }

        function getRasterValueAtPoint(layerId, latlng) {
            if (!georasters[layerId]) return null;
            try {
                var georaster = georasters[layerId];
                var x = latlng.lng;
                var y = latlng.lat;
                var xmin = georaster.xmin, xmax = georaster.xmax;
                var ymin = georaster.ymin, ymax = georaster.ymax;
                var width = georaster.width, height = georaster.height;
                if (x < xmin || x > xmax || y < ymin || y > ymax) return null;
                var pixelWidth = (xmax - xmin) / width;
                var pixelHeight = (ymax - ymin) / height;
                var pixelX = Math.floor((x - xmin) / pixelWidth);
                var pixelY = Math.floor((ymax - y) / pixelHeight);
                if (pixelX < 0 || pixelX >= width || pixelY < 0 || pixelY >= height) return null;
                var values = georaster.values;
                if (values && values[0] && values[0][pixelY]) {
                    var value = values[0][pixelY][pixelX];
                    console.log('Layer:', layerId, 'Raw value:', value, 'Type:', typeof value, 'NoDataValue:', georaster.noDataValue);
                    if (value !== null && value !== undefined && !isNaN(value)) {
                        if (value === 255 || value === 15 || value === -9999 || value === -3.4e38 || 
                            Math.abs(value) > 1e10 || value === -32768) return null;
                        if (georaster.noDataValue !== null && georaster.noDataValue !== undefined && !isNaN(georaster.noDataValue)) {
                            if (Math.abs(value - georaster.noDataValue) < 0.0001) return null;
                        }
                        return value;
                    }
                }
            } catch (error) {
                console.log('Error getting value for ' + layerId + ':', error);
            }
            return null;
        }

        // =====================================================================
        // NIPAH OUTBREAK LOCATIONS (outbreaks.json — 137 documented locations)
        // Colored by country: Bangladesh = red target, India = blue target
        // =====================================================================
        function loadNipahCases() {
            fetch('outbreaks.json')
                .then(response => {
                    if (!response.ok) throw new Error('Outbreaks file not found');
                    return response.json();
                })
                .then(data => {
                    updateStatus('Loaded ' + data.features.length + ' Nipah outbreak locations');
                    nipahCasesLayer = L.geoJSON(data, {
                        pointToLayer: function(feature, latlng) {
                            var size = 14;

            var s = size || 12;

            if (shape === 'diamond') {
                var half = s / 2;
                svg = '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '" xmlns="http://www.w3.org/2000/svg">' +
                      '<polygon points="' + half + ',0 ' + s + ',' + half + ' ' + half + ',' + s + ' 0,' + half + '" ' +
                      'fill="' + color + '" stroke="#000" stroke-width="1.5"/></svg>';
            } else if (shape === 'triangle') {
                svg = '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '" xmlns="http://www.w3.org/2000/svg">' +
                      '<polygon points="' + (s/2) + ',0 ' + s + ',' + s + ' 0,' + s + '" ' +
                      'fill="' + color + '" stroke="#000" stroke-width="1.5"/></svg>';
            } else if (shape === 'square') {
                svg = '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '" xmlns="http://www.w3.org/2000/svg">' +
                      '<rect x="1" y="1" width="' + (s-2) + '" height="' + (s-2) + '" ' +
                      'fill="' + color + '" stroke="#000" stroke-width="1.5"/></svg>';
            } else {
                return null;
            }
            return L.divIcon({ html: svg, className: '', iconSize: [s, s], iconAnchor: [s/2, s/2] });
        }

        // =====================================================================
        // RASTER LAYER LOADING — all 6 layers via georaster
        // =====================================================================
        function loadLayer(layerId) {
            var config = layerConfigs[layerId];
            updateStatus('Loading ' + config.name + '...');
            fetch(config.file)
                .then(response => {
                    if (!response.ok) throw new Error('HTTP error! status: ' + response.status);
                    updateStatus(config.name + ' fetched successfully');
                    return response.arrayBuffer();
                })
                .then(arrayBuffer => {
                    updateStatus('Parsing ' + config.name + '...');
                    return parseGeoraster(arrayBuffer);
                })
                .then(georaster => {
                    updateStatus(config.name + ' parsed successfully');
                    georasters[layerId] = georaster;
                    console.log('Loaded ' + layerId + ' - noDataValue:', georaster.noDataValue);
                    
                    var layerOpacity = DEFAULT_OPACITY;
                    var pixelValuesToColorFn;
                    var configNoData = config.noDataValue || null;
                    
                    if (config.discreteColors) {
                        var discreteColors = config.discreteColors;
                        pixelValuesToColorFn = function(values) {
                            var value = values[0];
                            if (value === null || value === undefined || isNaN(value)) return null;
                            if (value === 255 || value === 15) return null;
                            if (configNoData !== null && value === configNoData) return null;
                            if (georaster.noDataValue !== null && georaster.noDataValue !== undefined && !isNaN(georaster.noDataValue)) {
                                if (Math.abs(value - georaster.noDataValue) < 0.0001) return null;
                            }
                            var intValue = Math.round(value);
                            if (hiddenClasses[layerId] && hiddenClasses[layerId][intValue]) return null;
                            if (discreteColors.hasOwnProperty(intValue)) return discreteColors[intValue];
                            return null;
                        };
                    } else {
                        // Continuous color scale (ENM, ENM CV)
                        var scale = config.mode 
                            ? chroma.scale(config.colors).mode(config.mode).domain(config.domain)
                            : chroma.scale(config.colors).domain(config.domain);
                        var noDataVal = georaster.noDataValue;
                        pixelValuesToColorFn = function(values) {
                            var value = values[0];
                            if (value === null || value === undefined || isNaN(value)) return null;
                            if (value === 255 || value === -9999 || value === -32768 || value === -3.4e38 || Math.abs(value) > 1e10) return null;
                            if (noDataVal !== null && noDataVal !== undefined && !isNaN(noDataVal)) {
                                if (Math.abs(value - noDataVal) < 0.0001) return null;
                            }
                            return scale(value).hex();
                        };
                    }
                    
                    var layerPane = 'raster_' + layerId;
                    
                    var layer = new GeoRasterLayer({
                        georaster: georaster,
                        opacity: layerOpacity,
                        pixelValuesToColorFn: pixelValuesToColorFn,
                        resolution: 256,
                        pane: layerPane
                    });
                    
                    layers[layerId] = layer;
                    loadedCount++;
                    updateStatus(config.name + ' ready! (' + loadedCount + '/' + totalLayers + ')');
                    
                    // Default: ENM shown on load
                    if (layerId === 'enm') {
                        layer.addTo(map);
                        activeLayers[layerId] = true;
                        currentLayer = 'enm';
                        updateLegend();
                        updateAdminBoundaryStyle();
                    }
                    
                    if (loadedCount === totalLayers) {
                        // loading complete
                    }
                })
                .catch(error => {
                    var errorMsg = 'Error loading ' + config.name + ': ' + error.message;
                    updateStatus(errorMsg, true);
                    console.error(errorMsg, error);
                    if (error.message.includes('Failed to fetch') || error.message.includes('CORS')) {
                        updateStatus('⚠️ CORS Error: You must serve files through a web server!', true);
                        updateStatus('Try using: R servr::httd() or Python http.server', true);
                    }
                    loadedCount++;
                    if (loadedCount === totalLayers) {
                        // loading complete
                    }
                });
        }

        // =====================================================================

        function toggleLayer(layerId, show) {
            if (!layers[layerId]) return;
            if (show) { layers[layerId].addTo(map); activeLayers[layerId] = true; }
            else { map.removeLayer(layers[layerId]); delete activeLayers[layerId]; }
            // Determine which is the "top" active analysis layer for click queries
            var analysisLayers = ['enm', 'enm_cv', 'basic_risk', 'blend_risk', 'risk_blend_cv', 'diff_blend_minus_basic'];
            currentLayer = null;
            for (var i = analysisLayers.length - 1; i >= 0; i--) {
                if (activeLayers[analysisLayers[i]]) { currentLayer = analysisLayers[i]; break; }
            }
            updateLegend();
            updateAdminBoundaryStyle();
            updateDescriptionBox();
        }

        function updateDescriptionBox() {
            var descDiv = document.getElementById('layer-description');
            if (!currentLayer || !layerConfigs[currentLayer]) {
                descDiv.classList.add('hidden');
                return;
            }
            var config = layerConfigs[currentLayer];
            if (config.infoDescription) {
                descDiv.innerHTML = '<h4>' + config.name + '</h4><p>' + config.infoDescription + '</p>';
                descDiv.classList.remove('hidden');
            } else {
                descDiv.classList.add('hidden');
            }
        }

        

        function toggleClass(layerId, classValue, show) {
            if (!hiddenClasses[layerId]) return;
            if (show) { delete hiddenClasses[layerId][classValue]; } else { hiddenClasses[layerId][classValue] = true; }
            refreshLayer(layerId);
        }
        
        function refreshLayer(layerId) {
            if (!layers[layerId] || !activeLayers[layerId]) return;
            var config = layerConfigs[layerId];
            var georaster = georasters[layerId];
            if (!georaster) return;
            map.removeLayer(layers[layerId]);
            var layerOpacity = DEFAULT_OPACITY;
            var opacitySlider = document.getElementById('opacity-' + layerId);
            if (opacitySlider) layerOpacity = opacitySlider.value / 100;
            var pixelValuesToColorFn;
            var configNoData = config.noDataValue || null;
            
            if (config.discreteColors) {
                var discreteColors = config.discreteColors;
                var hidden = hiddenClasses[layerId];
                pixelValuesToColorFn = function(values) {
                    var value = values[0];
                    if (value === null || value === undefined || isNaN(value)) return null;
                    if (value === 255 || value === 15) return null;
                    if (configNoData !== null && value === configNoData) return null;
                    if (georaster.noDataValue !== null && georaster.noDataValue !== undefined && !isNaN(georaster.noDataValue)) {
                        if (Math.abs(value - georaster.noDataValue) < 0.0001) return null;
                    }
                    var intValue = Math.round(value);
                    if (hidden[intValue]) return null;
                    if (discreteColors.hasOwnProperty(intValue)) return discreteColors[intValue];
                    return null;
                };
            }
            if (!pixelValuesToColorFn) return;
            
            var newLayer = new GeoRasterLayer({
                georaster: georaster,
                opacity: layerOpacity,
                pixelValuesToColorFn: pixelValuesToColorFn,
                resolution: 256,
                pane: 'raster_' + layerId
            });
            layers[layerId] = newLayer;
            newLayer.addTo(map);
        }

        // =====================================================================
        // LEGEND
        // =====================================================================
        function updateLegend() {
            var legendDiv = document.getElementById('legend-content');
            legendDiv.innerHTML = '';
            var activeKeys = Object.keys(activeLayers);
            if (activeKeys.length === 0) legendDiv.innerHTML = '<h4>No layers active</h4>';
            
            activeKeys.forEach(function(layerId, idx) {
                if (layerId.startsWith('species_')) return;
                var config = layerConfigs[layerId];
                if (!config) return;
                if (idx > 0) legendDiv.innerHTML += '<div style="margin:10px 0; border-top:1px solid #ddd;"></div>';
                legendDiv.innerHTML += '<h4>' + config.name + '</h4>';
                if (config.customLegend && config.legendItems) {
                    config.legendItems.forEach(function(item) {
                        var isHidden = hiddenClasses[layerId] && hiddenClasses[layerId][item.value];
                        var checkedAttr = isHidden ? '' : 'checked';
                        var hiddenClass = isHidden ? ' hidden-class' : '';
                        legendDiv.innerHTML += '<div class="item toggleable' + hiddenClass + '">' +
                            '<input type="checkbox" ' + checkedAttr + ' onchange="toggleClass(\'' + layerId + '\', ' + item.value + ', this.checked)">' +
                            '<i style="background:' + item.color + '"></i> ' + item.label + '</div>';
                    });
                } else if (config.continuousLegend) {
                    var gradientStops = [];
                    for (var i = 0; i < config.colors.length; i++) {
                        gradientStops.push(config.colors[i] + ' ' + ((i / (config.colors.length - 1)) * 100) + '%');
                    }
                    legendDiv.innerHTML += '<div class="gradient-bar" style="background: linear-gradient(to right, ' + gradientStops.join(', ') + ');"></div>' +
                        '<div class="gradient-labels"><span>' + config.labels[0] + '</span><span>' + config.labels[1] + '</span></div>';
                }
                if (config.description) legendDiv.innerHTML += '<p style="margin-top:10px; font-size:11px; color:#777;">' + config.description + '</p>';
            });
            
            // Species/survey legend
            var activeSpeciesVectors = [];
            Object.keys(speciesSurveyConfigs).forEach(function(key) {
                if (activeLayers['species_' + key]) activeSpeciesVectors.push(key);
            });
            if (activeSpeciesVectors.length > 0) {
                legendDiv.innerHTML += '<div style="margin:10px 0; border-top:1px solid #ddd;"></div>';
                legendDiv.innerHTML += '<h4>Species & Survey Data</h4>';
                activeSpeciesVectors.forEach(function(key) {
                    var cfg = speciesSurveyConfigs[key];
                    if (key === 'gbif_bats' && cfg.colorBySpecies && gbifSpeciesList.length > 0) {
                        legendDiv.innerHTML += '<div style="font-size:11px; font-weight:bold; margin-bottom:4px;">GBIF Bat Occurrences by Species</div>';
                        gbifSpeciesList.forEach(function(species) {
                            var color = getGbifSpeciesColor(species);
                            var count = gbifSpeciesCounts[species] || 0;
                            var isHidden = hiddenGbifSpecies[species];
                            var checkedAttr = isHidden ? '' : 'checked';
                            var hiddenClass = isHidden ? ' hidden-class' : '';
                            var escapedSpecies = species.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                            legendDiv.innerHTML += '<div class="item toggleable' + hiddenClass + '">' +
                                '<input type="checkbox" ' + checkedAttr + ' onchange="toggleGbifSpecies(\'' + escapedSpecies + '\', this.checked)">' +
                                '<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:' + color + 
                                ';border:1.5px solid #000000;margin-right:6px;vertical-align:middle;"></span>' +
                                '<span style="font-size:11px;"><em>' + species + '</em> <span style="color:#999;">(' + count + ')</span></span></div>';
                        });
                        return;
                    }
                    // Survey layer - diamond symbol
                    if (key === 'nipah_survey') {
                        legendDiv.innerHTML += '<div class="item">' +
                            '<svg width="14" height="14" viewBox="0 0 14 14" style="vertical-align:middle;margin-right:8px;"><polygon points="7,0 14,7 7,14 0,7" fill="' + cfg.fillColor + '" stroke="#000" stroke-width="1"/></svg>' +
                            '<span style="font-size:11px;">' + cfg.name + '</span></div>';
                        return;
                    }
                    var symbolHtml = '<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:' + cfg.fillColor + ';border:1px solid #000;margin-right:8px;vertical-align:middle;"></span>';
                    legendDiv.innerHTML += '<div class="item">' + symbolHtml + '<span style="font-size:11px;">' + cfg.name + '</span></div>';
                });
            }
            
            // Outbreak locations legend
            if (nipahCasesLayer) {
                legendDiv.innerHTML += '<div class="plague-cases-section">';
                legendDiv.innerHTML += '<div class="item">' +
                    '<svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:middle;margin-right:8px;" xmlns="http://www.w3.org/2000/svg">' +
                    '<circle cx="12" cy="12" r="11" fill="white" stroke="#000000" stroke-width="2"/>' +
                    '<circle cx="12" cy="12" r="7" fill="none" stroke="#000000" stroke-width="1.5"/>' +
                    '<circle cx="12" cy="12" r="3" fill="#000000"/>' +
                    '</svg><span style="font-size:11px;">Nipah Outbreak Locations (2001–2026)</span></div>';
                legendDiv.innerHTML += '</div>';
            }
        }

        // =====================================================================
        // LAYER CONTROL PANEL
        // =====================================================================
        var layerControl = L.control({position: 'topleft'});
        layerControl.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'layer-control');
            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);
            
            div.innerHTML = '<h4>Basemaps</h4>';
            div.innerHTML += '<label><input type="radio" name="basemap" value="street" onchange="switchBasemap(\'street\')">Street Map</label>';
            div.innerHTML += '<label><input type="radio" name="basemap" value="satellite" checked onchange="switchBasemap(\'satellite\')">Satellite Imagery</label>';
            div.innerHTML += '<label><input type="radio" name="basemap" value="topo" onchange="switchBasemap(\'topo\')">Topographic</label>';
            
            div.innerHTML += '<h4 style="margin-top:15px; padding-top:10px; border-top: 1px solid #ddd;">Analysis Layers</h4>';
            
            // Raster layer checkboxes — enm on by default
            var rasterKeys = ['enm', 'enm_cv', 'basic_risk', 'blend_risk', 'risk_blend_cv', 'diff_blend_minus_basic'];
            rasterKeys.forEach(function(key) {
                var checked = (key === 'enm') ? 'checked' : '';
                div.innerHTML += '<label><input type="checkbox" name="layer" value="' + key + '" ' + checked + 
                    ' onchange="toggleLayer(\'' + key + '\', this.checked)">' + layerConfigs[key].name + '</label>';
            });
            
            div.innerHTML += '<h4 style="margin-top:15px; padding-top:10px; border-top: 1px solid #ddd;">Species &amp; Survey Data</h4>';
            
            Object.keys(speciesSurveyConfigs).forEach(function(key) {
                var cfg = speciesSurveyConfigs[key];
                div.innerHTML += '<label><input type="checkbox" name="species-layer" value="' + key + '" checked ' + 
                    'onchange="toggleSpeciesSurveyLayer(\'' + key + '\', this.checked)">' + cfg.name + '</label>';
            });
            
            div.innerHTML += '<div class="overlay-section">';
            div.innerHTML += '<h4 style="margin:0 0 8px; font-size:13px;">Overlays</h4>';
            div.innerHTML += '<label><input type="checkbox" id="nipah-cases-toggle" checked onchange="toggleNipahCases(this.checked)">Nipah Outbreak Locations</label>';
            div.innerHTML += '<label><input type="checkbox" id="admin-toggle" checked onchange="toggleAdminBoundaries(this.checked)">M-Region Boundary</label>';
            div.innerHTML += '</div>';
            
            div.innerHTML += '<div class="opacity-section"><h5>Layer Opacity</h5>';
            rasterKeys.forEach(function(key) {
                div.innerHTML += '<div class="opacity-control">' +
                    '<label>' + layerConfigs[key].name + ' <span class="opacity-value" id="opacity-value-' + key + '">' + Math.round(DEFAULT_OPACITY * 100) + '%</span></label>' +
                    '<input type="range" id="opacity-' + key + '" min="0" max="100" value="' + (DEFAULT_OPACITY * 100) + '" ' +
                    'oninput="updateLayerOpacity(\'' + key + '\', this.value/100); document.getElementById(\'opacity-value-' + key + '\').textContent = this.value + \'%\'"></div>';
            });
            div.innerHTML += '</div>';
            
            return div;
        };
        layerControl.addTo(map);

        // Create legend
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.id = 'legend-content';
            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);
            return div;
        };
        legend.addTo(map);

        // =====================================================================
        // MAP CLICK & CONTEXT MENU
        // =====================================================================
        map.on('contextmenu', function(e) {
            copyCoordinatesToClipboard(e.latlng.lat, e.latlng.lng);
        });

        map.on('click', function(e) {
            if (!currentLayer || !georasters[currentLayer]) return;
            var value = getRasterValueAtPoint(currentLayer, e.latlng);
            var config = layerConfigs[currentLayer];
            var displayValue;
            if (value !== null) {
                if (config.discreteDisplay) {
                    var intVal = Math.round(value);
                    displayValue = intVal.toString();
                    // Look up matching legend label
                    if (config.legendItems) {
                        for (var i = 0; i < config.legendItems.length; i++) {
                            if (config.legendItems[i].value === intVal) {
                                displayValue = config.legendItems[i].label;
                                break;
                            }
                        }
                    }
                } else {
                    displayValue = value.toFixed(4);
                }
            } else {
                displayValue = 'No Data';
            }
            var popupContent = '<h3>' + config.name + '</h3><table>';
            popupContent += '<tr><td>Coordinates</td><td>' + e.latlng.lat.toFixed(6) + ', ' + e.latlng.lng.toFixed(6) + '</td></tr>';
            popupContent += '<tr><td>Cell Value</td><td>' + displayValue + '</td></tr>';
            popupContent += '</table>';
            L.popup().setLatLng(e.latlng).setContent(popupContent).openOn(map);
        });

        // =====================================================================
        // LOAD EVERYTHING
        // =====================================================================
        updateStatus('Starting to load layers...');
        Object.keys(layerConfigs).forEach(function(key) { loadLayer(key); });
        loadNipahCases();
        loadAdminBoundaries();
        Object.keys(speciesSurveyConfigs).forEach(function(key) { loadSpeciesSurveyLayer(key); });
    </script>
</body>
</html>

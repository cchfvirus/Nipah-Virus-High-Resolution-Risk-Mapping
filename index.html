<!DOCTYPE html>
<html>
<head>
    <title>Nipah Risk Mapping - Interactive Layers</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        .info { 
            padding: 10px 12px; 
            background: white; 
            box-shadow: 0 0 15px rgba(0,0,0,0.2); 
            border-radius: 5px; 
            max-width: 300px;
        }
        
        .info h4 { margin: 0 0 5px; color: #333; }
        .info p { margin: 5px 0; font-size: 12px; color: #666; }
        
        .legend {
            line-height: 20px;
            color: #555;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            max-width: 250px;
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .legend h4 { margin: 0 0 8px; font-size: 14px; }
        
        .legend i {
            width: 20px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.8;
            border: 1px solid #ccc;
        }
        
        .legend .item { 
            margin-bottom: 5px; 
            overflow: hidden; 
            font-size: 11px;
        }
        
        .legend .item.toggleable {
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            transition: opacity 0.2s;
        }
        
        .legend .item.toggleable:hover {
            background: #f0f0f0;
        }
        
        .legend .item.toggleable.hidden-class {
            opacity: 0.35;
            text-decoration: line-through;
        }
        
        .legend .item.toggleable input[type="checkbox"] {
            margin-right: 4px;
            vertical-align: middle;
            cursor: pointer;
        }
        
        .legend .gradient-bar {
            width: 100%;
            height: 20px;
            margin: 10px 0;
            border: 1px solid #ccc;
        }
        
        .legend .gradient-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-top: 3px;
        }
        
        .legend .plague-cases-section {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }
        
        .legend .plague-case-symbol {
            display: inline-block;
            font-size: 18px;
            color: #1e88e5;
            text-shadow: 1px 1px 2px #FFF, -1px -1px 2px #FFF, 1px -1px 2px #FFF, -1px 1px 2px #FFF;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        .layer-control {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
            max-width: 220px;
        }
        
        .layer-control h4 { 
            margin: 0 0 10px; 
            font-size: 14px;
        }
        
        .layer-control label {
            display: block;
            margin: 8px 0;
            cursor: pointer;
            font-size: 13px;
        }
        
        .layer-control input[type="radio"] {
            margin-right: 8px;
        }
        
        .layer-control input[type="checkbox"] {
            margin-right: 8px;
        }
        
        .layer-control .overlay-section {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }
        
        .layer-control .overlay-section h5 {
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .opacity-section {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }
        
        .opacity-section h5 {
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .opacity-control {
            margin-bottom: 12px;
        }
        
        .opacity-control label {
            display: block;
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
        }
        
        .opacity-control input[type="range"] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        
        .opacity-value {
            float: right;
            font-weight: bold;
            color: #333;
            font-size: 11px;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            z-index: 1000;
            text-align: center;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            margin: 5px 0;
            border-radius: 3px;
            font-size: 12px;
        }
        
        .leaflet-popup-content {
            margin: 10px;
            font-size: 12px;
        }
        
        .leaflet-popup-content h3 {
            margin: 0 0 8px;
            font-size: 14px;
            color: #333;
        }
        
        .leaflet-popup-content table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .leaflet-popup-content table td {
            padding: 3px 5px;
            border-bottom: 1px solid #eee;
        }
        
        .leaflet-popup-content table td:first-child {
            font-weight: bold;
            color: #666;
            width: 50%;
        }
        
        .copy-notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .copy-notification.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">
        <div>Loading map layers...</div>
        <div id="load-status" style="margin-top: 10px; font-size: 12px;"></div>
    </div>
    <div id="map"></div>
    <div id="copy-notification" class="copy-notification"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet@3.10.0/dist/georaster-layer-for-leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

    <script>
        // =====================================================================
        // MAP INITIALIZATION - centered on Bangladesh/India Nipah endemic region
        // =====================================================================
        var map = L.map('map').setView([20.0, 85.0], 5);

        // Create custom panes with specific z-index ordering
        map.createPane('rasterPane');
        map.getPane('rasterPane').style.zIndex = 300;
        
        map.createPane('tileRiskPane');
        map.getPane('tileRiskPane').style.zIndex = 310;
        
        map.createPane('analysisPane');
        map.getPane('analysisPane').style.zIndex = 315;
        
        map.createPane('speciesVectorPane');
        map.getPane('speciesVectorPane').style.zIndex = 360;
        
        map.createPane('boundariesPane');
        map.getPane('boundariesPane').style.zIndex = 350;

        // Define basemaps
        var streetMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 19
        });

        var satelliteMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 19
        });

        // Add default basemap (Satellite)
        satelliteMap.addTo(map);

        // =====================================================================
        // STATE VARIABLES
        // =====================================================================
        var layers = {};
        var georasters = {};
        var currentLayer = null;
        var activeLayers = {};
        var loadedCount = 0;
        var totalLayers = 2; // georaster layers only: enm, enm_cv
        var nipahCasesLayer = null;
        var adminBoundariesLayer = null;

        var DEFAULT_OPACITY = 0.8;

        // =====================================================================
        // TILE-BASED LAYERS (100m resolution — pre-rendered PNG tile pyramids)
        // Tiles live in folders: tiles_risk_basic/, tiles_risk_blend/, etc.
        // Colors are baked into the PNG tiles. Toggle = add/remove L.tileLayer.
        // =====================================================================
        var tileLayerConfigs = {
            'basic_risk': {
                tileDir: 'tiles_risk_basic',
                name: 'Basic Exposure Risk Index (100m)',
                description: 'Nipah Transmission Risk – Basic Model (ENM×Pop)',
                minZoom: 5,
                maxZoom: 10,
                legendItems: [
                    { color: '#000000', label: '0 – No Risk' },
                    { color: '#FFFFBE', label: '1 – Very Low Risk' },
                    { color: '#FFDD00', label: '2 – Low Risk' },
                    { color: '#FFAA00', label: '3 – Moderate Risk' },
                    { color: '#FF6600', label: '4 – Elevated Risk' },
                    { color: '#FF0000', label: '6 – High Risk' },
                    { color: '#A80000', label: '9 – Very High Risk' }
                ]
            },
            'blend_risk': {
                tileDir: 'tiles_risk_blend',
                name: 'Blended Exposure Risk Index (100m)',
                description: 'Nipah Transmission Risk – Blended Model (ENM×Pop×LC)',
                minZoom: 5,
                maxZoom: 10,
                legendItems: [
                    { color: '#000000', label: '0 – No Risk' },
                    { color: '#FFFFBE', label: '1 – Very Low Risk' },
                    { color: '#FFDD00', label: '2 – Low Risk' },
                    { color: '#FFAA00', label: '3 – Moderate Risk' },
                    { color: '#FF6600', label: '4 – Elevated Risk' },
                    { color: '#FF0000', label: '6 – High Risk' },
                    { color: '#A80000', label: '9 – Very High Risk' }
                ]
            },
            'risk_blend_cv': {
                tileDir: 'tiles_risk_blend_cv',
                name: 'Risk Blend CV (100m)',
                description: 'Coefficient of variation across blended risk ensemble',
                minZoom: 5,
                maxZoom: 10,
                legendItems: [
                    { color: '#2166ac', label: '0 – Very Low CV' },
                    { color: '#4393c3', label: '1 – Low CV' },
                    { color: '#92c5de', label: '2 – Low-Moderate CV' },
                    { color: '#d1e5f0', label: '3 – Moderate CV' },
                    { color: '#fddbc7', label: '5 – Moderate-High CV' },
                    { color: '#f4a582', label: '6 – High CV' },
                    { color: '#d6604d', label: '7 – Very High CV' },
                    { color: '#b2182b', label: '8 – Extreme CV' },
                    { color: '#7f0000', label: '9 – Extreme+ CV' }
                ]
            },
            'diff_blend_minus_basic': {
                tileDir: 'tiles_diff_blend_minus_basic',
                name: 'Difference: Blend − Basic (100m)',
                description: 'Change in normalized risk: blended vs basic model',
                minZoom: 5,
                maxZoom: 10,
                legendItems: [
                    { color: '#2166ac', label: '1 – Large Decrease' },
                    { color: '#67a9cf', label: '2 – Moderate Decrease' },
                    { color: '#d1e5f0', label: '3 – Small Decrease' },
                    { color: '#f7f7f7', label: '4 – No Change' },
                    { color: '#fddbc7', label: '5 – Small Increase' },
                    { color: '#ef8a62', label: '6 – Moderate Increase' },
                    { color: '#b2182b', label: '7 – Large Increase' }
                ]
            }
        };

        // Create tile layers (not added to map yet except blend_risk)
        Object.keys(tileLayerConfigs).forEach(function(key) {
            var cfg = tileLayerConfigs[key];
            layers[key] = L.tileLayer(cfg.tileDir + '/{z}/{x}/{y}.png', {
                minZoom: cfg.minZoom,
                maxZoom: cfg.maxZoom,
                maxNativeZoom: cfg.maxZoom,
                opacity: DEFAULT_OPACITY,
                pane: 'tileRiskPane',
                tms: false,
                errorTileUrl: ''
            });
            // Suppress 404 tile errors (tiles only exist where data exists)
            layers[key].on('tileerror', function(e) {
                e.tile.style.display = 'none';
            });
        });

        // Default: blend_risk shown on load
        layers['blend_risk'].addTo(map);
        activeLayers['blend_risk'] = true;
        currentLayer = 'blend_risk';

        // =====================================================================
        // GEORASTER LAYER CONFIGS (1km resolution — loaded in browser memory)
        // =====================================================================
        var georasterConfigs = {
            'enm': {
                file: 'enm_cog.tif',
                name: 'Ecological Niche Model (1km)',
                colors: ['#969696', '#fed976', '#feb24c', '#fd8d3c', '#fc4e2a', '#e31a1c', '#b10026'],
                domain: [0, 912],
                labels: ['Low Suitability', 'High Suitability'],
                description: 'Nipah ENM habitat suitability',
                mode: 'lch',
                continuousLegend: true,
                pane: 'analysisPane'
            },
            'enm_cv': {
                file: 'enm_cv.tif',
                name: 'ENM Coefficient of Variation (1km)',
                colors: ['#f7fcf5', '#c7e9c0', '#74c476', '#31a354', '#006d2c'],
                domain: [0, 297],
                labels: ['Low Uncertainty', 'High Uncertainty'],
                description: 'Model uncertainty (CV across replicates)',
                mode: 'lch',
                continuousLegend: true,
                pane: 'analysisPane'
            }
        };

        // Combined config lookup for legend/UI (merges both types)
        var allLayerConfigs = {};
        Object.keys(tileLayerConfigs).forEach(function(k) {
            allLayerConfigs[k] = tileLayerConfigs[k];
        });
        Object.keys(georasterConfigs).forEach(function(k) {
            allLayerConfigs[k] = georasterConfigs[k];
        });

        // =====================================================================
        // MEASUREMENT TOOLS
        // =====================================================================
        var drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        var drawControl = new L.Control.Draw({
            position: 'topright',
            draw: {
                polyline: {
                    shapeOptions: { color: '#f357a1', weight: 3 },
                    metric: true,
                    feet: false,
                    showLength: true
                },
                polygon: {
                    shapeOptions: { color: '#f357a1', weight: 3 },
                    showArea: true,
                    metric: true
                },
                rectangle: {
                    shapeOptions: { color: '#4CAF50', weight: 3, fillOpacity: 0.1 }
                },
                circle: false,
                marker: false,
                circlemarker: false
            },
            edit: {
                featureGroup: drawnItems,
                remove: true
            }
        });
        map.addControl(drawControl);

        map.on(L.Draw.Event.CREATED, function (event) {
            var layer = event.layer;
            var type = event.layerType;
            
            if (type === 'polyline') {
                var length = 0;
                var latlngs = layer.getLatLngs();
                for (var i = 0; i < latlngs.length - 1; i++) {
                    length += latlngs[i].distanceTo(latlngs[i + 1]);
                }
                var lengthKm = (length / 1000).toFixed(2);
                layer.bindPopup('<b>Distance:</b> ' + lengthKm + ' km');
                drawnItems.addLayer(layer);
            } else if (type === 'polygon') {
                var area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
                var areaKm = (area / 1000000).toFixed(2);
                layer.bindPopup('<b>Area:</b> ' + areaKm + ' km²');
                drawnItems.addLayer(layer);
            } else if (type === 'rectangle') {
                var bounds = layer.getBounds();
                var area = (bounds.getNorth() - bounds.getSouth()) * 
                           (bounds.getEast() - bounds.getWest()) * 111 * 111;
                layer.bindPopup('<b>Rectangle Area:</b> ~' + area.toFixed(2) + ' km²');
                drawnItems.addLayer(layer);
            }
        });

        // =====================================================================
        // COORDINATE COPY
        // =====================================================================
        function copyCoordinatesToClipboard(lat, lng) {
            var coordText = lat.toFixed(6) + ', ' + lng.toFixed(6);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(coordText).then(function() {
                    showCopyNotification('Coordinates copied: ' + coordText);
                }).catch(function(err) {
                    fallbackCopyTextToClipboard(coordText);
                });
            } else {
                fallbackCopyTextToClipboard(coordText);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            var textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                var successful = document.execCommand('copy');
                if (successful) {
                    showCopyNotification('Coordinates copied: ' + text);
                } else {
                    showCopyNotification('Failed to copy coordinates', true);
                }
            } catch (err) {
                showCopyNotification('Failed to copy coordinates', true);
            }
            document.body.removeChild(textArea);
        }

        function showCopyNotification(message, isError) {
            var notification = document.getElementById('copy-notification');
            notification.textContent = message;
            notification.style.background = isError ? 'rgba(198, 40, 40, 0.9)' : 'rgba(0, 0, 0, 0.8)';
            notification.classList.add('show');
            setTimeout(function() {
                notification.classList.remove('show');
            }, 2000);
        }

        // =====================================================================
        // UTILITY FUNCTIONS
        // =====================================================================
        function updateStatus(message, isError) {
            var statusDiv = document.getElementById('load-status');
            if (isError) {
                statusDiv.innerHTML += '<div class="error">' + message + '</div>';
            } else {
                statusDiv.innerHTML += '<div>' + message + '</div>';
            }
            console.log(message);
        }

        function updateLayerOpacity(layerId, opacity) {
            if (layers[layerId] && layers[layerId].setOpacity) {
                layers[layerId].setOpacity(opacity);
            }
        }

        function getRasterValueAtPoint(layerId, latlng) {
            if (!georasters[layerId]) return null;
            try {
                var georaster = georasters[layerId];
                var x = latlng.lng;
                var y = latlng.lat;
                var xmin = georaster.xmin, xmax = georaster.xmax;
                var ymin = georaster.ymin, ymax = georaster.ymax;
                var width = georaster.width, height = georaster.height;
                if (x < xmin || x > xmax || y < ymin || y > ymax) return null;
                var pixelWidth = (xmax - xmin) / width;
                var pixelHeight = (ymax - ymin) / height;
                var pixelX = Math.floor((x - xmin) / pixelWidth);
                var pixelY = Math.floor((ymax - y) / pixelHeight);
                if (pixelX < 0 || pixelX >= width || pixelY < 0 || pixelY >= height) return null;
                var values = georaster.values;
                if (values && values[0] && values[0][pixelY]) {
                    var value = values[0][pixelY][pixelX];
                    if (value !== null && value !== undefined && !isNaN(value)) {
                        if (value === 255 || value === -9999 || value === -3.4e38 || 
                            Math.abs(value) > 1e10 || value === -32768) return null;
                        if (georaster.noDataValue !== null && georaster.noDataValue !== undefined && !isNaN(georaster.noDataValue)) {
                            if (Math.abs(value - georaster.noDataValue) < 0.0001) return null;
                        }
                        return value;
                    }
                }
            } catch (error) {
                console.log('Error getting value for ' + layerId + ':', error);
            }
            return null;
        }

        // =====================================================================
        // NIPAH CASES (placeholder — swap in your GeoJSON file)
        // =====================================================================
        function loadNipahCases() {
            fetch('cases.geojson')
                .then(function(response) {
                    if (!response.ok) throw new Error('Cases file not found');
                    return response.json();
                })
                .then(function(data) {
                    updateStatus('Loaded ' + data.features.length + ' Nipah cases');
                    nipahCasesLayer = L.geoJSON(data, {
                        pointToLayer: function(feature, latlng) {
                            var size = 24;
                            var svg = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
                                '<circle cx="12" cy="12" r="11" fill="white" stroke="#000000" stroke-width="1.5"/>' +
                                '<circle cx="12" cy="12" r="7" fill="white" stroke="#000000" stroke-width="1.5"/>' +
                                '<circle cx="12" cy="12" r="3" fill="white" stroke="#000000" stroke-width="1.5"/>' +
                                '</svg>';
                            var icon = L.divIcon({
                                html: svg,
                                className: '',
                                iconSize: [size, size],
                                iconAnchor: [size/2, size/2]
                            });
                            return L.marker(latlng, { icon: icon });
                        },
                        onEachFeature: function(feature, layer) {
                            var popupContent = '<h3>Nipah Cases</h3><table>';
                            for (var key in feature.properties) {
                                if (feature.properties.hasOwnProperty(key)) {
                                    var value = feature.properties[key];
                                    var displayKey = key.replace(/_/g, ' ').replace(/\b\w/g, function(l) {
                                        return l.toUpperCase();
                                    });
                                    popupContent += '<tr><td>' + displayKey + '</td><td>' + value + '</td></tr>';
                                }
                            }
                            popupContent += '</table>';
                            layer.bindPopup(popupContent, { maxWidth: 300, maxHeight: 400 });
                        }
                    });
                    nipahCasesLayer.addTo(map);
                    updateLegend();
                })
                .catch(function(error) {
                    console.log('Cases file not found - layer will not be available');
                });
        }

        function toggleNipahCases(show) {
            if (nipahCasesLayer) {
                if (show) {
                    nipahCasesLayer.addTo(map);
                } else {
                    map.removeLayer(nipahCasesLayer);
                }
            }
        }

        // =====================================================================
        // ADMIN BOUNDARIES (placeholder — swap in your boundary file)
        // =====================================================================
        function updateAdminBoundaryStyle() {
            if (adminBoundariesLayer) {
                var boundaryColor = (currentLayer === 'basic_risk' || currentLayer === 'blend_risk') ? '#FFFFFF' : '#000000';
                adminBoundariesLayer.setStyle({
                    fillColor: 'transparent',
                    fillOpacity: 0,
                    color: boundaryColor,
                    weight: 1,
                    opacity: 1
                });
            }
        }

        function loadAdminBoundaries() {
            fetch('admin2.json')
                .then(function(response) {
                    if (!response.ok) throw new Error('Admin boundaries file not found');
                    return response.json();
                })
                .then(function(data) {
                    updateStatus('Loaded admin boundaries');
                    var initialColor = (currentLayer === 'basic_risk' || currentLayer === 'blend_risk') ? '#FFFFFF' : '#000000';
                    adminBoundariesLayer = L.geoJSON(data, {
                        style: {
                            fillColor: 'transparent',
                            fillOpacity: 0,
                            color: initialColor,
                            weight: 1,
                            opacity: 1
                        },
                        pane: 'boundariesPane',
                        interactive: false
                    });
                    adminBoundariesLayer.addTo(map);
                })
                .catch(function(error) {
                    console.log('Admin boundaries file not found - layer will not be available');
                });
        }

        function toggleAdminBoundaries(show) {
            if (adminBoundariesLayer) {
                if (show) {
                    adminBoundariesLayer.addTo(map);
                } else {
                    map.removeLayer(adminBoundariesLayer);
                }
            }
        }

        // =====================================================================
        // GBIF Role-based coloring (placeholder — kept from original)
        // =====================================================================
        var gbifRoleColorPalette = {
            'Reservoir':       '#e31a1c',
            'Host':            '#ff7f00',
            'Vector':          '#6a3d9a',
            'Predator':        '#1f78b4',
            'Prey':            '#b2df8a',
            'Carrier':         '#fb9a99',
            'Sentinel':        '#33a02c',
            'Commensal':       '#fdbf6f',
            'Unknown':         '#999999',
            'Incidental Host': '#cab2d6'
        };
        var gbifRoleFallbackColors = [
            '#a6cee3', '#b15928', '#ffff99', '#66c2a5', '#fc8d62',
            '#8da0cb', '#e78ac3', '#a6d854', '#ffd92f', '#e5c494'
        ];
        var gbifRoleFallbackIndex = 0;
        var gbifRoleColors = {};
        var gbifRoleList = [];
        var gbifRoleCounts = {};
        var hiddenGbifRoles = {};
        
        function getGbifRoleColor(role) {
            if (!role || role === '' || role === null) role = 'Unknown';
            if (gbifRoleColors[role]) return gbifRoleColors[role];
            if (gbifRoleColorPalette[role]) {
                gbifRoleColors[role] = gbifRoleColorPalette[role];
            } else {
                gbifRoleColors[role] = gbifRoleFallbackColors[gbifRoleFallbackIndex % gbifRoleFallbackColors.length];
                gbifRoleFallbackIndex++;
            }
            return gbifRoleColors[role];
        }

        // =====================================================================
        // SPECIES & SURVEY GEOJSON (placeholder configs — swap in your files)
        // =====================================================================
        var speciesSurveyLayers = {};
        var speciesSurveyConfigs = {
            'gbif_species': {
                file: 'GBIF_species.geojson',
                name: 'GBIF Species Occurrences',
                color: '#8B5CF6',
                fillColor: '#8B5CF6',
                radius: 6,
                weight: 2,
                icon: 'circle',
                colorByRole: true
            }
            // Add more survey GeoJSON configs here as needed:
            // 'nipah_survey': {
            //     file: 'nipah_survey.geojson',
            //     name: 'Nipah Survey Data',
            //     color: '#F59E0B',
            //     fillColor: '#F59E0B',
            //     radius: 6,
            //     icon: 'diamond'
            // }
        };

        function createSvgIcon(shape, color, size) {
            var s = size || 12;
            var svg;
            if (shape === 'diamond') {
                var half = s / 2;
                svg = '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '" xmlns="http://www.w3.org/2000/svg">' +
                      '<polygon points="' + half + ',0 ' + s + ',' + half + ' ' + half + ',' + s + ' 0,' + half + '" ' +
                      'fill="' + color + '" stroke="#000" stroke-width="1.5"/></svg>';
            } else if (shape === 'triangle') {
                svg = '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '" xmlns="http://www.w3.org/2000/svg">' +
                      '<polygon points="' + (s/2) + ',0 ' + s + ',' + s + ' 0,' + s + '" ' +
                      'fill="' + color + '" stroke="#000" stroke-width="1.5"/></svg>';
            } else if (shape === 'square') {
                svg = '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '" xmlns="http://www.w3.org/2000/svg">' +
                      '<rect x="1" y="1" width="' + (s-2) + '" height="' + (s-2) + '" ' +
                      'fill="' + color + '" stroke="#000" stroke-width="1.5"/></svg>';
            } else {
                return null;
            }
            return L.divIcon({ html: svg, className: '', iconSize: [s, s], iconAnchor: [s/2, s/2] });
        }
        
        function loadSpeciesSurveyLayer(layerId) {
            var config = speciesSurveyConfigs[layerId];
            fetch(config.file)
                .then(function(response) {
                    if (!response.ok) throw new Error(config.name + ' file not found');
                    return response.json();
                })
                .then(function(data) {
                    var featureCount = data.features ? data.features.length : 0;
                    updateStatus('Loaded ' + config.name + ' (' + featureCount + ' features)');
                    
                    if (layerId === 'gbif_species' && config.colorByRole) {
                        gbifRoleList = [];
                        gbifRoleCounts = {};
                        gbifRoleColors = {};
                        gbifRoleFallbackIndex = 0;
                        data.features.forEach(function(f) {
                            var role = (f.properties && f.properties.Role) ? f.properties.Role.trim() : 'Unknown';
                            if (!role || role === '') role = 'Unknown';
                            if (!gbifRoleCounts[role]) {
                                gbifRoleCounts[role] = 0;
                                gbifRoleList.push(role);
                            }
                            gbifRoleCounts[role]++;
                        });
                        var roleOrder = ['Reservoir', 'Host', 'Vector', 'Carrier', 'Predator', 'Prey', 'Sentinel', 'Commensal', 'Incidental Host'];
                        gbifRoleList.sort(function(a, b) {
                            var ia = roleOrder.indexOf(a), ib = roleOrder.indexOf(b);
                            if (ia === -1 && ib === -1) return a.localeCompare(b);
                            if (ia === -1) return 1;
                            if (ib === -1) return -1;
                            return ia - ib;
                        });
                        gbifRoleList.forEach(function(role) { getGbifRoleColor(role); });
                    }
                    
                    var geojsonLayer = L.geoJSON(data, {
                        pointToLayer: function(feature, latlng) {
                            if (layerId === 'gbif_species' && config.colorByRole) {
                                var role = (feature.properties && feature.properties.Role) ? feature.properties.Role.trim() : 'Unknown';
                                if (!role || role === '') role = 'Unknown';
                                var roleColor = getGbifRoleColor(role);
                                return L.circleMarker(latlng, {
                                    color: '#000000',
                                    fillColor: roleColor,
                                    fillOpacity: 0.9,
                                    radius: config.radius,
                                    weight: config.weight || 2,
                                    pane: 'speciesVectorPane'
                                });
                            }
                            if (config.icon && config.icon !== 'circle') {
                                var icon = createSvgIcon(config.icon, config.fillColor, 14);
                                if (icon) return L.marker(latlng, { icon: icon, pane: 'speciesVectorPane' });
                            }
                            return L.circleMarker(latlng, {
                                color: '#000000',
                                fillColor: config.fillColor,
                                fillOpacity: 0.9,
                                radius: config.radius,
                                weight: config.weight || 2,
                                pane: 'speciesVectorPane'
                            });
                        },
                        style: function(feature) {
                            if (feature.geometry && feature.geometry.type === 'Point') return {};
                            return {
                                color: config.color,
                                fillColor: config.fillColor,
                                fillOpacity: 0.4,
                                weight: 2,
                                opacity: 0.8
                            };
                        },
                        filter: function(feature) {
                            if (layerId === 'gbif_species' && config.colorByRole) {
                                var role = (feature.properties && feature.properties.Role) ? feature.properties.Role.trim() : 'Unknown';
                                if (!role || role === '') role = 'Unknown';
                                if (hiddenGbifRoles[role]) return false;
                            }
                            return true;
                        },
                        pane: 'speciesVectorPane',
                        onEachFeature: function(feature, layer) {
                            var popupContent = '<h3>' + config.name + '</h3><table>';
                            for (var key in feature.properties) {
                                if (feature.properties.hasOwnProperty(key)) {
                                    var value = feature.properties[key];
                                    if (value === null || value === undefined || value === '') continue;
                                    var displayKey = key.replace(/_/g, ' ').replace(/\b\w/g, function(l) {
                                        return l.toUpperCase();
                                    });
                                    popupContent += '<tr><td>' + displayKey + '</td><td>' + value + '</td></tr>';
                                }
                            }
                            popupContent += '</table>';
                            layer.bindPopup(popupContent, { maxWidth: 300, maxHeight: 400 });
                        }
                    });
                    
                    speciesSurveyLayers[layerId] = geojsonLayer;
                    if (layerId === 'gbif_species') speciesSurveyLayers['gbif_species_data'] = data;

                    geojsonLayer.addTo(map);
                    activeLayers['species_' + layerId] = true;
                    updateLegend();
                })
                .catch(function(error) {
                    console.log(config.name + ' not found - layer will not be available:', error.message);
                });
        }
        
        function toggleGbifRole(role, show) {
            if (show) { delete hiddenGbifRoles[role]; } else { hiddenGbifRoles[role] = true; }
            if (activeLayers['species_gbif_species'] && speciesSurveyLayers['gbif_species_data']) {
                if (speciesSurveyLayers['gbif_species']) map.removeLayer(speciesSurveyLayers['gbif_species']);
                var config = speciesSurveyConfigs['gbif_species'];
                var data = speciesSurveyLayers['gbif_species_data'];
                var geojsonLayer = L.geoJSON(data, {
                    pointToLayer: function(feature, latlng) {
                        var r = (feature.properties && feature.properties.Role) ? feature.properties.Role.trim() : 'Unknown';
                        if (!r || r === '') r = 'Unknown';
                        var roleColor = getGbifRoleColor(r);
                        return L.circleMarker(latlng, {
                            color: '#000000',
                            fillColor: roleColor,
                            fillOpacity: 0.9,
                            radius: config.radius,
                            weight: config.weight || 2,
                            pane: 'speciesVectorPane'
                        });
                    },
                    filter: function(feature) {
                        var r = (feature.properties && feature.properties.Role) ? feature.properties.Role.trim() : 'Unknown';
                        if (!r || r === '') r = 'Unknown';
                        return !hiddenGbifRoles[r];
                    },
                    pane: 'speciesVectorPane',
                    onEachFeature: function(feature, layer) {
                        var popupContent = '<h3>' + config.name + '</h3><table>';
                        for (var key in feature.properties) {
                            if (feature.properties.hasOwnProperty(key)) {
                                var value = feature.properties[key];
                                if (value === null || value === undefined || value === '') continue;
                                var displayKey = key.replace(/_/g, ' ').replace(/\b\w/g, function(l) {
                                    return l.toUpperCase();
                                });
                                popupContent += '<tr><td>' + displayKey + '</td><td>' + value + '</td></tr>';
                            }
                        }
                        popupContent += '</table>';
                        layer.bindPopup(popupContent, { maxWidth: 300, maxHeight: 400 });
                    }
                });
                speciesSurveyLayers['gbif_species'] = geojsonLayer;
                geojsonLayer.addTo(map);
            }
            updateLegend();
        }
        
        function toggleSpeciesSurveyLayer(layerId, show) {
            var lyr = speciesSurveyLayers[layerId];
            if (!lyr) return;
            if (show) {
                lyr.addTo(map);
                activeLayers['species_' + layerId] = true;
            } else {
                map.removeLayer(lyr);
                delete activeLayers['species_' + layerId];
            }
            updateLegend();
        }
        
        function updateSpeciesSurveyOpacity(layerId, opacity) {
            var lyr = speciesSurveyLayers[layerId];
            if (!lyr) return;
            lyr.eachLayer(function(layer) {
                if (layer.setStyle) {
                    layer.setStyle({ fillOpacity: opacity, opacity: opacity });
                } else if (layer.setOpacity) {
                    layer.setOpacity(opacity);
                }
            });
        }

        // =====================================================================
        // BASEMAP SWITCH
        // =====================================================================
        function switchBasemap(basemapType) {
            map.removeLayer(streetMap);
            map.removeLayer(satelliteMap);
            if (basemapType === 'street') {
                streetMap.addTo(map);
            } else if (basemapType === 'satellite') {
                satelliteMap.addTo(map);
            }
        }

        // =====================================================================
        // GEORASTER LAYER LOADING (1km layers only)
        // =====================================================================
        function loadGeoRasterLayer(layerId) {
            var config = georasterConfigs[layerId];
            updateStatus('Loading ' + config.name + '...');
            fetch(config.file)
                .then(function(response) {
                    if (!response.ok) throw new Error('HTTP error! status: ' + response.status);
                    updateStatus(config.name + ' fetched successfully');
                    return response.arrayBuffer();
                })
                .then(function(arrayBuffer) {
                    updateStatus('Parsing ' + config.name + '...');
                    return parseGeoraster(arrayBuffer);
                })
                .then(function(georaster) {
                    updateStatus(config.name + ' parsed successfully');
                    georasters[layerId] = georaster;
                    
                    var scale = config.mode 
                        ? chroma.scale(config.colors).mode(config.mode).domain(config.domain)
                        : chroma.scale(config.colors).domain(config.domain);
                    var noDataVal = georaster.noDataValue;
                    
                    var pixelValuesToColorFn = function(values) {
                        var value = values[0];
                        if (value === null || value === undefined || isNaN(value)) return null;
                        if (value === 255 || value === -9999 || value === -32768 || value === -3.4e38 || Math.abs(value) > 1e10) return null;
                        if (noDataVal !== null && noDataVal !== undefined && !isNaN(noDataVal)) {
                            if (Math.abs(value - noDataVal) < 0.0001) return null;
                        }
                        return scale(value).hex();
                    };
                    
                    var layer = new GeoRasterLayer({
                        georaster: georaster,
                        opacity: DEFAULT_OPACITY,
                        pixelValuesToColorFn: pixelValuesToColorFn,
                        resolution: 256,
                        pane: config.pane || 'analysisPane'
                    });
                    
                    layers[layerId] = layer;
                    loadedCount++;
                    updateStatus(config.name + ' ready! (' + loadedCount + '/' + totalLayers + ')');
                    
                    if (loadedCount === totalLayers) {
                        setTimeout(function() {
                            document.getElementById('loading').style.display = 'none';
                        }, 1000);
                    }
                })
                .catch(function(error) {
                    var errorMsg = 'Error loading ' + config.name + ': ' + error.message;
                    updateStatus(errorMsg, true);
                    console.error(errorMsg, error);
                    if (error.message.includes('Failed to fetch') || error.message.includes('CORS')) {
                        updateStatus('⚠️ CORS Error: You must serve files through a web server!', true);
                        updateStatus('Try using: R servr::httd() or Python http.server', true);
                    }
                    loadedCount++;
                    if (loadedCount === totalLayers) {
                        setTimeout(function() {
                            document.getElementById('loading').style.display = 'none';
                        }, 1000);
                    }
                });
        }

        // =====================================================================
        // LAYER TOGGLE (works for both tile and georaster layers)
        // =====================================================================
        function toggleLayer(layerId, show) {
            if (!layers[layerId]) return;
            if (show) {
                layers[layerId].addTo(map);
                activeLayers[layerId] = true;
            } else {
                map.removeLayer(layers[layerId]);
                delete activeLayers[layerId];
            }
            // Determine which is the "top" active analysis layer for click queries
            var priority = ['enm', 'enm_cv', 'basic_risk', 'blend_risk', 'risk_blend_cv', 'diff_blend_minus_basic'];
            currentLayer = null;
            for (var i = priority.length - 1; i >= 0; i--) {
                if (activeLayers[priority[i]]) {
                    currentLayer = priority[i];
                    break;
                }
            }
            updateLegend();
            updateAdminBoundaryStyle();
        }

        // =====================================================================
        // LEGEND
        // =====================================================================
        function updateLegend() {
            var legendDiv = document.getElementById('legend-content');
            legendDiv.innerHTML = '';
            var activeKeys = Object.keys(activeLayers);
            if (activeKeys.length === 0) {
                legendDiv.innerHTML = '<h4>No layers active</h4>';
                return;
            }
            
            var idx = 0;
            activeKeys.forEach(function(layerId) {
                if (layerId.startsWith('species_')) return;
                var config = allLayerConfigs[layerId];
                if (!config) return;
                
                if (idx > 0) {
                    legendDiv.innerHTML += '<div style="margin:10px 0; border-top:1px solid #ddd;"></div>';
                }
                legendDiv.innerHTML += '<h4>' + config.name + '</h4>';
                
                if (config.legendItems) {
                    config.legendItems.forEach(function(item) {
                        legendDiv.innerHTML += '<div class="item"><i style="background:' + item.color + '"></i> ' + item.label + '</div>';
                    });
                } else if (config.continuousLegend) {
                    var gradientStops = [];
                    for (var i = 0; i < config.colors.length; i++) {
                        gradientStops.push(config.colors[i] + ' ' + ((i / (config.colors.length - 1)) * 100) + '%');
                    }
                    legendDiv.innerHTML += '<div class="gradient-bar" style="background: linear-gradient(to right, ' + gradientStops.join(', ') + ');"></div>' +
                        '<div class="gradient-labels"><span>' + config.labels[0] + '</span><span>' + config.labels[1] + '</span></div>';
                }
                
                if (config.description) {
                    legendDiv.innerHTML += '<p style="margin-top:10px; font-size:11px; color:#777;">' + config.description + '</p>';
                }
                idx++;
            });
            
            // Species/survey legend
            var activeSpeciesVectors = [];
            Object.keys(speciesSurveyConfigs).forEach(function(key) {
                if (activeLayers['species_' + key]) activeSpeciesVectors.push(key);
            });
            if (activeSpeciesVectors.length > 0) {
                legendDiv.innerHTML += '<div style="margin:10px 0; border-top:1px solid #ddd;"></div>';
                legendDiv.innerHTML += '<h4>Species & Survey Data</h4>';
                activeSpeciesVectors.forEach(function(key) {
                    var cfg = speciesSurveyConfigs[key];
                    if (key === 'gbif_species' && cfg.colorByRole && gbifRoleList.length > 0) {
                        legendDiv.innerHTML += '<div style="font-size:11px; font-weight:bold; margin-bottom:4px;">GBIF Species by Ecology Role</div>';
                        gbifRoleList.forEach(function(role) {
                            var color = getGbifRoleColor(role);
                            var count = gbifRoleCounts[role] || 0;
                            var isHidden = hiddenGbifRoles[role];
                            var checkedAttr = isHidden ? '' : 'checked';
                            var hiddenClass = isHidden ? ' hidden-class' : '';
                            var escapedRole = role.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                            legendDiv.innerHTML += '<div class="item toggleable' + hiddenClass + '">' +
                                '<input type="checkbox" ' + checkedAttr + ' onchange="toggleGbifRole(\'' + escapedRole + '\', this.checked)">' +
                                '<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:' + color + 
                                ';border:2px solid #000000;margin-right:6px;vertical-align:middle;"></span>' +
                                '<span style="font-size:11px;">' + role + ' <span style="color:#999;">(' + count + ')</span></span></div>';
                        });
                        return;
                    }
                    var symbolHtml = '<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:' + cfg.fillColor + ';border:1px solid #000;margin-right:8px;vertical-align:middle;"></span>';
                    legendDiv.innerHTML += '<div class="item">' + symbolHtml + '<span style="font-size:11px;">' + cfg.name + '</span></div>';
                });
            }
            
            // Cases legend
            if (nipahCasesLayer) {
                legendDiv.innerHTML += '<div class="plague-cases-section"><div class="item">' +
                    '<svg width="16" height="16" viewBox="0 0 24 24" style="vertical-align:middle;margin-right:8px;" xmlns="http://www.w3.org/2000/svg">' +
                    '<circle cx="12" cy="12" r="11" fill="white" stroke="#000000" stroke-width="1.5"/>' +
                    '<circle cx="12" cy="12" r="7" fill="white" stroke="#000000" stroke-width="1.5"/>' +
                    '<circle cx="12" cy="12" r="3" fill="white" stroke="#000000" stroke-width="1.5"/>' +
                    '</svg><span style="font-size:11px;">Nipah Cases</span></div></div>';
            }
        }

        // =====================================================================
        // LAYER CONTROL PANEL
        // =====================================================================
        var layerControl = L.control({position: 'topleft'});
        layerControl.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'layer-control');
            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);
            
            div.innerHTML = '<h4>Basemaps</h4>';
            div.innerHTML += '<label><input type="radio" name="basemap" value="street" onchange="switchBasemap(\'street\')">Street Map</label>';
            div.innerHTML += '<label><input type="radio" name="basemap" value="satellite" checked onchange="switchBasemap(\'satellite\')">Satellite Imagery</label>';
            
            div.innerHTML += '<h4 style="margin-top:15px; padding-top:10px; border-top: 1px solid #ddd;">Analysis Layers</h4>';
            
            // All layer checkboxes — blend_risk on by default
            var allKeys = ['enm', 'enm_cv', 'basic_risk', 'blend_risk', 'risk_blend_cv', 'diff_blend_minus_basic'];
            allKeys.forEach(function(key) {
                var checked = (key === 'blend_risk') ? 'checked' : '';
                div.innerHTML += '<label><input type="checkbox" name="layer" value="' + key + '" ' + checked + 
                    ' onchange="toggleLayer(\'' + key + '\', this.checked)">' + allLayerConfigs[key].name + '</label>';
            });
            
            div.innerHTML += '<h4 style="margin-top:15px; padding-top:10px; border-top: 1px solid #ddd;">Species &amp; Survey Data</h4>';
            
            Object.keys(speciesSurveyConfigs).forEach(function(key) {
                var cfg = speciesSurveyConfigs[key];
                div.innerHTML += '<label><input type="checkbox" name="species-layer" value="' + key + '" checked ' + 
                    'onchange="toggleSpeciesSurveyLayer(\'' + key + '\', this.checked)">' + cfg.name + '</label>';
            });
            
            div.innerHTML += '<div class="overlay-section">';
            div.innerHTML += '<h5>Overlays</h5>';
            div.innerHTML += '<label><input type="checkbox" id="nipah-cases-toggle" checked onchange="toggleNipahCases(this.checked)">Nipah Cases</label>';
            div.innerHTML += '<label><input type="checkbox" id="admin-toggle" checked onchange="toggleAdminBoundaries(this.checked)">Admin Boundaries</label>';
            div.innerHTML += '</div>';
            
            div.innerHTML += '<div class="opacity-section"><h5>Layer Opacity</h5>';
            allKeys.forEach(function(key) {
                div.innerHTML += '<div class="opacity-control">' +
                    '<label>' + allLayerConfigs[key].name + ' <span class="opacity-value" id="opacity-value-' + key + '">' + Math.round(DEFAULT_OPACITY * 100) + '%</span></label>' +
                    '<input type="range" id="opacity-' + key + '" min="0" max="100" value="' + (DEFAULT_OPACITY * 100) + '" ' +
                    'oninput="updateLayerOpacity(\'' + key + '\', this.value/100); document.getElementById(\'opacity-value-' + key + '\').textContent = this.value + \'%\'"></div>';
            });
            Object.keys(speciesSurveyConfigs).forEach(function(key) {
                var cfg = speciesSurveyConfigs[key];
                div.innerHTML += '<div class="opacity-control">' +
                    '<label>' + cfg.name + ' <span class="opacity-value" id="opacity-value-species-' + key + '">' + Math.round(DEFAULT_OPACITY * 100) + '%</span></label>' +
                    '<input type="range" id="opacity-species-' + key + '" min="0" max="100" value="' + (DEFAULT_OPACITY * 100) + '" ' +
                    'oninput="updateSpeciesSurveyOpacity(\'' + key + '\', this.value/100); document.getElementById(\'opacity-value-species-' + key + '\').textContent = this.value + \'%\'"></div>';
            });
            div.innerHTML += '</div>';
            
            return div;
        };
        layerControl.addTo(map);

        // Create legend
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.id = 'legend-content';
            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);
            return div;
        };
        legend.addTo(map);

        // =====================================================================
        // MAP CLICK & CONTEXT MENU
        // =====================================================================
        map.on('contextmenu', function(e) {
            copyCoordinatesToClipboard(e.latlng.lat, e.latlng.lng);
        });

        map.on('click', function(e) {
            // Click-query works for georaster layers; tile layers show coords only
            if (!currentLayer) return;
            
            if (georasters[currentLayer]) {
                var value = getRasterValueAtPoint(currentLayer, e.latlng);
                var config = georasterConfigs[currentLayer];
                var displayValue;
                if (value !== null) {
                    displayValue = value.toFixed(4);
                } else {
                    displayValue = 'No Data';
                }
                var popupContent = '<h3>' + config.name + '</h3><table>';
                popupContent += '<tr><td>Coordinates</td><td>' + e.latlng.lat.toFixed(6) + ', ' + e.latlng.lng.toFixed(6) + '</td></tr>';
                popupContent += '<tr><td>Cell Value</td><td>' + displayValue + '</td></tr>';
                popupContent += '</table>';
                L.popup().setLatLng(e.latlng).setContent(popupContent).openOn(map);
            } else if (tileLayerConfigs[currentLayer]) {
                var popupContent = '<h3>' + tileLayerConfigs[currentLayer].name + '</h3><table>';
                popupContent += '<tr><td>Coordinates</td><td>' + e.latlng.lat.toFixed(6) + ', ' + e.latlng.lng.toFixed(6) + '</td></tr>';
                popupContent += '</table>';
                L.popup().setLatLng(e.latlng).setContent(popupContent).openOn(map);
            }
        });

        // =====================================================================
        // LOAD EVERYTHING
        // =====================================================================
        updateStatus('Starting to load layers...');
        updateStatus('Tile layers ready (basic_risk, blend_risk, risk_blend_cv, diff_blend_minus_basic)');
        Object.keys(georasterConfigs).forEach(function(key) { loadGeoRasterLayer(key); });
        updateLegend();
